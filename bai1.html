<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài thơ Bốn Mùa</title>
    <style>
        /* Khung bài thơ: nền vàng nhạt, viền xám, căn giữa */
        .khung-bai-tho {
            background-color: #FFFDE7;
            border: 2px solid #9E9E9E;
            width: 500px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
        }

        /* Tiêu đề BỐN MÙA: chữ đỏ, nền hồng, in đậm, căn giữa */
        .tieu-de {
            color: #D40000;
            background-color: #FFD9E6;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 20px;
        }

        /* Định dạng chung cho đoạn văn thơ: in nghiêng, căn giữa */
        p {
            font-style: italic;
            text-align: center;
            line-height: 1.6;
            margin: 15px 0;
        }

        /* Màu sắc từng khổ thơ */
        .kho-1-3 {
            color: #0033CC; /* Xanh dương */
        }

        .kho-2 {
            color: #D40000; /* Đỏ */
        }

        /* Đường kẻ ngang giữa các khổ thơ: màu xanh dương, rộng ~55%, căn giữa */
        hr {
            border: 0;
            height: 1px;
            background-color: #0033CC;
            width: 55%;
            margin: 15px auto;
        }
    </style>
</head>
<body>

    <div class="khung-bai-tho">
        <h2 class="tieu-de">BỐN MÙA</h2>

        <!-- Khổ 1 -->
        <p class="kho-1-3">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <!-- Khổ 2 -->
        <p class="kho-2">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <!-- Khổ 3 -->
        <p class="kho-1-3">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </div>

</body>
</html>
